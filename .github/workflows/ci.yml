name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Lint (undefined names / syntax)
        run: |
          python -m pip install ruff
          python -m ruff check --select F821,F811,F823,E9 .
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest -q
      - name: Tests (Linux, virtual display for the GUI smoke test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk xvfb || true
          xvfb-run -a python -m pytest -q
